name: Windows package

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          architecture: x64
      - uses: android-actions/setup-android@v3
      - name: Install Android build SDK
        shell: pwsh
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Locate or install WiX 3
        shell: pwsh
        run: |
          $wix = Get-ChildItem 'C:\Program Files (x86)' -Directory -Filter 'WiX Toolset v3*' | Select-Object -First 1
          if (-not $wix) {
            choco install wixtoolset --version=3.14.1 -y --no-progress
            $wix = Get-ChildItem 'C:\Program Files (x86)' -Directory -Filter 'WiX Toolset v3*' | Select-Object -First 1
          }
          if (-not $wix) { throw 'WiX 3 installation was not found' }
          $bin = Join-Path $wix.FullName 'bin'
          if (-not (Test-Path (Join-Path $bin 'candle.exe'))) { throw 'candle.exe was not found' }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Windows app image, portable zip and installers
        shell: pwsh
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: .\gradlew.bat :desktopApp:createDistributable :desktopApp:portableZip :desktopApp:packageMsi :desktopApp:packageExe --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: FlowPlay-windows-x64
          if-no-files-found: error
          path: |
            desktopApp/build/compose/binaries/main/portable/*.zip
            desktopApp/build/compose/binaries/main/msi/*.msi
            desktopApp/build/compose/binaries/main/exe/*.exe
