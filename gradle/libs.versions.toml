[versions]
kotlin = "2.3.10"
compose = "1.9.3"
agp = "8.11.1"
coroutines = "1.10.2"
serialization = "1.9.0"
ktor = "3.3.1"
settings = "1.3.0"
coil = "3.3.0"
sqldelight = "2.1.0"
media3 = "1.8.0"
jna = "5.17.0"
quickjs = "1.0.3"

[libraries]
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
ktor-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
settings = { module = "com.russhwolf:multiplatform-settings", version.ref = "settings" }
material-icons = { module = "org.jetbrains.compose.material:material-icons-core", version = "1.7.3" }
android-activity = { module = "androidx.activity:activity-compose", version = "1.10.1" }
# Subsequent milestones use these pinned candidates after platform integration checks.
coil = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
sqldelight-android = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
sqldelight-jdbc = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }
coil-network = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
quickjs = { module = "io.github.dokar3:quickjs-kt", version.ref = "quickjs" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
